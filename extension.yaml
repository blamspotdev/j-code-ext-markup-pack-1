id: jcode.lang.markup
name: Markup Dev Pack
version: 1.0.3
type: language
requires:
  lsps: [vscode-html-language-server, vscode-json-language-server, yaml-language-server]
suggests:
  sdks: [nodejs]

# One extension, many languages. Each entry is a self-contained language pack
# (coloring rules + completions + helpers + formatter) resolved by file extension.
languages:
  - html
  - xml
  - svg
  - yaml
  - json
  - toml
  - ini
# --- header fields merged from extension.jehm ---
publisher: jcode
shortDescription: Coloring, completions, snippets, and formatting for HTML, XML, SVG, YAML, JSON, TOML, CSS, and INI.
minJCodeVersion: 1.0.0
targetJCodeVersion: 1.0.0
category: Languages
subcategory: Markup
images:
  icon: media/icon.png
  samples: []
  walkthrough: []
entry:
  manifest: extension.yaml
  ui: null
  libs: []
